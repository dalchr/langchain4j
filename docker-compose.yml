services:
  # Uncomment below to run the Ktor app inside Docker as well.
  # Currently this service is disabled so that you can run the app locally
  # with "./gradlew run" and connect it to these containerized services.
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres
  #     - rabbitmq
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: "5432"
  #     POSTGRES_DB: ktor_db
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     RABBITMQ_HOST: rabbitmq
  #     RABBITMQ_PORT: "5672"
  #     RABBITMQ_USER: guest
  #     RABBITMQ_PASSWORD: guest

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ktor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: SuperSecretCookie
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
