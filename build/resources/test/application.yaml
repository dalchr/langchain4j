ktor:
  deployment:
    port: 8080
    responseTimeout: 120
  netty:
    config:
      responseWriteTimeoutSeconds: 120
  application:
    modules:
      - com.example.SerializationKt.configureSerialization
      - com.example.AuthenticationKt.configureAuthentication
      - com.example.ThymeleafKt.configureThymeleaf
      - com.example.PostgresKt.configurePostgres
      - com.example.RabbitmqKt.configureRabbitmq
      - com.example.RoutingKt.configureRouting

postgres:
  embedded: true
